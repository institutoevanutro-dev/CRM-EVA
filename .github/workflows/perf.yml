name: perf

on:
  pull_request:
    # `labeled`: pôr a etiqueta `ci-completo` dispara a rodada completa.
    types: [opened, synchronize, reopened, labeled]
    branches: [main]
  push:
    branches: [main]

# O GITHUB_TOKEN deste job serve a `actions/checkout` (clone) e a
# `actions/setup-node` (manifest de `actions/node-versions`, repo público).
# `pnpm build` é local e o relatório de tamanho é escrita em arquivo do runner
# (`>> $GITHUB_STEP_SUMMARY`), sem token. Ver o comentário em ci.yml para o
# porquê de o bloco ficar no topo.
permissions:
  contents: read

# CI ENXUTO (repositório privado, minutos de Actions cobrados). Com a variável
# de repositório `CI_ENXUTO=1`, os jobs pesados deste arquivo NÃO rodam em PR —
# rodam na `main`, em tag, por workflow_dispatch, ou em PR com a etiqueta
# `ci-completo`. Sem a variável, o comportamento é o do projeto original.
# Push novo no mesmo PR cancela a rodada anterior daquele PR; na `main` e em
# tag nada é cancelado — é ali que a imagem é publicada.
# Gatilhos vigiados em tests/unit/gatilho-dos-jobs-de-entrega.test.ts.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-size:
    # CI enxuto: ver o bloco `concurrency` no topo deste arquivo.
    if: github.event_name != 'pull_request' || vars.CI_ENXUTO != '1' || contains(github.event.pull_request.labels.*.name, 'ci-completo')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/preparar-node
        # O teto do preâmbulo mora aqui porque passo de composite action não
        # aceita `timeout-minutes`. Razão e medições: o cabeçalho da action.
        timeout-minutes: 5

      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          # "off", não vazio: vazio seleciona o Sentry DA COMUNIDADE
          # (lib/sentry/dsn.ts:8-10). A intenção aqui sempre foi desligar, e
          # com aspas vazias ela não era alcançada — o build seguia com o DSN
          # padrão embutido.
          SENTRY_DSN: "off"

      - name: Report bundle sizes
        run: |
          {
            echo "## Build output sizes"
            du -sh .next 2>/dev/null || true
            if [ -d .next/static ]; then du -sh .next/static; fi
          } >> "$GITHUB_STEP_SUMMARY"

      # NOTE: Lighthouse CI + bundle-analyzer thresholds deferred (S-12.05 follow-up).
